[package]
name = "rmail-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
webbrowser = "1.2.4"
tiny_http = "0.12.0"
anyhow = "1.0.104"
thiserror = "2.0.20"
keyring = { version = "4.2.0" }
